<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e0a" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>GOD SPEED · Control</title>
    <style>
      :root {
        --bg: #0a0e0a; --bg2: #0d1110; --card: #0f1411; --card2: #1b241e;
        --text: #e4edf7; --muted: #a2b0a8; --brand: #27bd89;
        --brand-bright: #39e6a6; --brand-dim: #0b6a40; --teal: #4fd6c8;
        --amber: #ffc24b; --red: #ff5c6a; --blue: #4f8cff; --purple: #a78bfa;
        --gold: #d4af37; --gold-soft: #d4b886; --cyan: #22d3ee;
        --border: #1c241e;
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
      }
      * { margin:0; padding:0; box-sizing:border-box; }
      body { font-family:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif;
        background:linear-gradient(180deg,var(--bg) 0%,#060a08 100%); color:var(--text);
        min-height:100vh; padding:calc(16px + var(--sat)) 16px calc(16px + var(--sab));
        -webkit-tap-highlight-color:transparent; }
      .wrap { max-width:520px; margin:0 auto; }
      #app { overflow-y:auto; -webkit-overflow-scrolling:touch; }
      header { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
      header .logo { display:flex; align-items:center; gap:10px; }
      header .logo .mark { width:38px; height:38px; border-radius:11px;
        background:linear-gradient(135deg, #182a22, #0f1a16);
        border:1.5px solid var(--gold);
        box-shadow:0 0 16px rgba(212,175,55,.28), inset 0 0 10px rgba(212,175,55,.08);
        display:flex; align-items:center; justify-content:center;
        color:var(--gold); font-weight:800; font-size:18px; position:relative; }
      header .logo .mark::after { content:''; position:absolute; inset:4px; border-radius:7px;
        border:1px solid rgba(212,175,55,.35); }
      header h1 { font-size:20px; font-weight:800; letter-spacing:1px; }
      header .badge { font-size:11px; color:var(--brand-bright); background:rgba(39,189,137,0.12);
        padding:4px 10px; border-radius:20px; border:1px solid rgba(39,189,137,0.35); font-weight:600; }
      /* Side nav drawer */
      #navToggle { flex:0 0 auto; width:38px; height:38px; border-radius:10px; background:var(--card);
        border:1px solid var(--border); color:var(--text); font-size:19px; line-height:1;
        cursor:pointer; display:flex; align-items:center; justify-content:center; }
      #navToggle:active { background:var(--card2); }
      #sideNav { position:fixed; top:0; left:0; width:260px; height:100dvh;
        background:linear-gradient(180deg,#0b0f0b 0%,#070a08 100%);
        border-right:1px solid var(--border); z-index:120; transform:translateX(-100%);
        transition:transform .2s ease; display:flex; flex-direction:column;
        padding:calc(20px + var(--sat)) 12px calc(16px + var(--sab)); }
      #sideNav.open { transform:translateX(0); }
      #sideNav .nav-brand { display:flex; align-items:center; gap:10px; padding:4px 8px 16px; border-bottom:1px solid var(--border); margin-bottom:10px; }
      #sideNav .nav-brand h2 { font-size:16px; font-weight:800; letter-spacing:1px; }
      #navBackdrop { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:110;
        opacity:0; pointer-events:none; transition:opacity .2s ease; }
      #navBackdrop.open { opacity:1; pointer-events:auto; }
      .nav-item { display:flex; align-items:center; gap:12px; padding:12px 12px;
        border-radius:10px; font-size:14px; font-weight:600; color:var(--muted);
        cursor:pointer; border:1px solid transparent; }
      .nav-item .nic { font-size:18px; width:22px; text-align:center; }
      .nav-item.active { background:var(--card2); color:var(--brand-bright); border-color:var(--brand-dim); }
      .nav-item:active { background:var(--card2); }
      .navsec { display:flex; align-items:center; gap:6px; padding:12px 14px 4px;
        font-size:10px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase;
        color:var(--gold); }
      .nav-live { margin-top:auto; padding-top:14px; border-top:1px solid var(--border);
        display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
      .grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:14px; }
      .tile { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; text-align:center; }
      .tile .label { font-size:11px; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.5px; }
      .tile .value { font-size:18px; font-weight:700; }
      .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
      .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; }
      .card h3 { font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin-bottom:10px; }
      .card .row { display:flex; justify-content:space-between; margin-bottom:8px; font-size:13px; }
      .card .row .muted { color:var(--muted); }
      .bar { height:8px; background:var(--bg2); border-radius:6px; overflow:hidden; }
      .bar-fill { height:100%; border-radius:6px; background:linear-gradient(90deg,var(--brand),var(--teal)); }
      .bar-fill.amber { background:linear-gradient(90deg,var(--amber),#ffd77a); }
      .svc { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:4px 16px; }
      .svc-item { display:flex; justify-content:space-between; align-items:center;
        padding:11px 0; border-bottom:1px solid var(--border); font-size:13px; }
      .svc-item:last-child { border-bottom:none; }
      .svc-item .name { color:var(--muted); font-family:monospace; font-size:12px; }
      .svc-item .state { font-size:12px; font-weight:600; }
      /* On/off toggle switch for service control */
      .svc-right { display:flex; align-items:center; gap:10px; }
      .switch { position:relative; width:42px; height:24px; flex:0 0 auto;
        border-radius:20px; background:var(--bg2); border:1px solid var(--border);
        cursor:pointer; transition:background .15s, border-color .15s; -webkit-tap-highlight-color:transparent; }
      .switch::after { content:''; position:absolute; top:2px; left:2px; width:18px; height:18px;
        border-radius:50%; background:var(--muted); transition:transform .15s ease, background .15s; }
      .switch.on { background:rgba(39,189,137,.18); border-color:var(--brand-dim); }
      .switch.on::after { transform:translateX(18px); background:var(--brand-bright); }
      .switch.busy { opacity:.55; pointer-events:none; }
      .switch.disabled { opacity:.35; cursor:not-allowed; }
      .switch.disabled::after { background:var(--muted); }
      .svc-lock { font-size:11px; color:var(--muted); }
      /* Pipeline stages */
      .pl-chain { display:flex; flex-direction:column; gap:6px; margin:10px 0; }
      .pl-stage { display:flex; align-items:center; gap:8px; padding:6px 10px;
        background:var(--card2); border:1px solid var(--border); border-radius:8px; }
      .pl-stage-idx { width:22px; height:22px; border-radius:6px; background:var(--brand-dim);
        color:var(--brand-bright); font-size:12px; font-weight:700; display:flex;
        align-items:center; justify-content:center; flex:0 0 auto; }
      .pl-stage-role { font-size:13px; font-weight:600; }
      .pl-stage-agent { font-size:11px; font-family:monospace; }
      .btn-mini { padding:6px 12px; font-size:12px; font-weight:600; border-radius:8px;
        background:var(--card2); border:1px solid var(--brand-dim); color:var(--brand-bright);
        cursor:pointer; margin-left:auto; }
      .btn-mini:active { background:var(--brand-dim); }
      .models { display:grid; grid-template-columns:1fr 1fr; gap:8px; max-height:220px; overflow-y:auto; }
      .model-chip { background:var(--card2); border:1px solid var(--border); border-radius:10px;
        padding:10px; display:flex; flex-direction:column; gap:6px; }
      .model-chip .mc-id { font-size:12px; font-family:monospace; font-weight:600; color:var(--text);
        overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .model-chip .mc-badges { display:flex; align-items:center; justify-content:space-between; gap:6px; }
      .model-chip .mc-owned { font-size:10px; font-weight:700; color:var(--teal); text-transform:uppercase;
        letter-spacing:.4px; background:rgba(79,214,200,.1); border:1px solid rgba(79,214,200,.25);
        padding:1px 7px; border-radius:20px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .model-chip .mc-avail .dot { margin-right:0; }
      .model-chip .mc-created { font-size:9px; color:var(--muted); font-family:monospace; }
      /* Fleet job timeline */
      .fleet-timeline { position:relative; padding-left:20px; }
      .fleet-timeline::before { content:''; position:absolute; left:5px; top:4px; bottom:4px;
        width:2px; background:var(--border); border-radius:2px; }
      .fl-item { position:relative; margin-bottom:14px; }
      .fl-line { position:relative; }
      .fl-dot { position:absolute; left:-20px; top:4px; width:12px; height:12px; border-radius:50%;
        background:var(--brand); border:2px solid var(--bg); box-shadow:0 0 0 2px var(--brand-dim); }
      .fl-body { background:var(--card2); border:1px solid var(--border); border-radius:10px; padding:9px 11px; }
      .fl-title { font-size:13px; font-weight:600; color:var(--text); margin-bottom:5px; word-break:break-word; }
      .fl-jid { font-family:monospace; font-size:10px; }
      .fl-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
      .fl-assignee { font-size:11px; color:var(--text); font-weight:600; }
      .fl-status { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;
        padding:1px 8px; border-radius:20px; border:1px solid; }
      .fl-ts { font-size:10px; font-family:monospace; }
      /* Fleet execution timeline (job lifecycle + replies) */
      .tl-body { background:linear-gradient(135deg,var(--card2),#18231d); border-color:rgba(39,189,137,.18); }
      .tl-dot { box-shadow:0 0 0 2px var(--bg); }
      .fleet-timeline { max-height:52vh; overflow-y:auto; padding-right:4px; }
      footer { text-align:center; color:var(--muted); font-size:11px; margin-top:16px; letter-spacing:.3px; }
      .btn { width:100%; padding:14px; margin-top:14px;
        background:linear-gradient(90deg,var(--brand),var(--teal)); color:#04150e;
        border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; }
      .btn:active { transform:scale(.98); }
      .loading { text-align:center; color:var(--muted); padding:40px 0; }
      /* Mini Apps 2.0: colored quick-action buttons */
      .quickgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
      .quick { display:flex; align-items:center; gap:10px; padding:14px; border-radius:14px;
        border:1px solid var(--border); cursor:pointer; font-weight:600; font-size:14px;
        transition:transform .08s ease, opacity .15s; }
      .quick:active { transform:scale(.96); opacity:.85; }
      .quick.blue { background:linear-gradient(135deg,#123050,#0e1e3a); color:#cfe0ff; border-color:#1d3a66; }
      .quick.green { background:linear-gradient(135deg,#0c3a28,#0a2419); color:#9ff0c9; border-color:#145a3a; }
      .quick.purple { background:linear-gradient(135deg,#2a1a4d,#1a1030); color:#d8c7ff; border-color:#3d2670; }
      .quick.amber { background:linear-gradient(135deg,#3a2a08,#2a1d05); color:#ffe4a3; border-color:#5c4712; }
      .quick .qic { font-size:20px; }
      /* Fleet dispatch form */
      .frm { display:flex; flex-direction:column; gap:10px; }
      .fld { display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--muted); }
      .fld span { text-transform:uppercase; letter-spacing:.5px; font-weight:600; }
      .fld select, .fld input, .fld textarea {
        width:100%; padding:10px; font-size:14px; color:var(--text);
        background:var(--card2); border:1px solid var(--border); border-radius:10px;
        font-family:inherit;
      }
      .fld select:focus, .fld input:focus, .fld textarea:focus { outline:none; border-color:var(--brand-dim); }
      .fld textarea { resize:vertical; }
      .fmsg { font-size:12px; min-height:18px; text-align:center; }
      /* Mini chat */
      .chat-wrap { display:flex; flex-direction:column; height:calc(100dvh - 150px); min-height:360px; }
      .chat-log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px;
        padding:6px 2px; -webkit-overflow-scrolling:touch; }
      .chat-msg { max-width:82%; padding:10px 13px; border-radius:14px; font-size:14px;
        line-height:1.45; white-space:pre-wrap; word-break:break-word; animation:fadeUp .15s ease; }
      @keyframes fadeUp { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
      .chat-msg.user { align-self:flex-end; background:linear-gradient(135deg,var(--brand),var(--teal));
        color:#04150e; border-bottom-right-radius:4px; font-weight:500; }
      .chat-msg.bot { align-self:flex-start; background:var(--card2); border:1px solid var(--border);
        color:var(--text); border-bottom-left-radius:4px; }
      .chat-msg.err { align-self:flex-start; background:rgba(255,92,106,.1); border:1px solid rgba(255,92,106,.3);
        color:var(--red); }
      .chat-msg .cm-model { display:block; font-size:9px; color:var(--muted); margin-top:6px;
        font-family:monospace; opacity:.8; }
      .chat-input-row { display:flex; gap:8px; padding-top:10px; border-top:1px solid var(--border); }
      .chat-input { flex:1; padding:12px 14px; font-size:14px; color:var(--text);
        background:var(--card2); border:1px solid var(--border); border-radius:12px;
        font-family:inherit; resize:none; max-height:96px; }
      .chat-input:focus { outline:none; border-color:var(--brand-dim); }
      .chat-send { flex:0 0 auto; width:46px; height:46px; border-radius:12px; border:none;
        background:linear-gradient(135deg,var(--brand),var(--teal)); color:#04150e;
        font-size:18px; font-weight:700; cursor:pointer; align-self:flex-end; }
      .chat-send:active { transform:scale(.94); }
      .chat-send:disabled { opacity:.5; }
      .chat-hint { font-size:11px; color:var(--muted); text-align:center; padding:8px 0 2px; }
      /* ── Fused Ultimate-Workspace elements ── */
      .legend { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin:4px 0 14px; }
      .legend span { display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--muted); letter-spacing:.4px; }
      .legend i { width:8px; height:8px; border-radius:50%; }
      .lg { background:var(--brand-bright); box-shadow:0 0 7px var(--brand); }
      .lb { background:var(--blue); box-shadow:0 0 7px var(--blue); }
      .la { background:var(--amber); box-shadow:0 0 7px var(--amber); }
      .lo { background:var(--red); box-shadow:0 0 7px var(--red); }
      .caps-strip { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px; }
      .cap-chip { background:var(--card2); border:1px solid var(--border); border-radius:12px; padding:10px 8px; text-align:center; }
      .cap-chip[cursor] { cursor:pointer; }
      .cap-chip:active { transform:scale(.95); opacity:.8; }
      .cap-chip .cic { font-size:17px; }
      .cap-chip .cct { font-size:10px; font-weight:700; color:var(--text); margin-top:4px; text-transform:uppercase; letter-spacing:.5px; }
      .cap-chip .ccd { font-size:8.5px; color:var(--muted); margin-top:2px; line-height:1.4; }
      .mission-strip { display:flex; align-items:center; gap:3px; margin:6px 0 14px; overflow-x:auto; padding-bottom:2px; }
      .m-step { flex:1; min-width:52px; text-align:center; font-size:8.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); padding:6px 3px; border-radius:8px; background:var(--card2); border:1px solid var(--border); }
      .m-step.on { color:var(--gold); border-color:var(--gold); background:linear-gradient(135deg, rgba(212,175,55,.14), rgba(34,211,238,.08)); }
      .m-step .mn { display:block; font-size:11px; color:var(--gold); }
      .m-sep { color:var(--gold); font-weight:800; font-size:10px; flex:0 0 auto; }
      .mini-logohead { display:flex; align-items:center; gap:10px; }
      .mini-logohead .ml { width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,#182a22,#0f1a16); border:1.5px solid var(--gold); color:var(--gold); font-weight:800; font-size:16px; display:flex; align-items:center; justify-content:center; box-shadow:0 0 14px rgba(212,175,55,.25); }
      /* ── Hero banner ── */
      .hero { position:relative; overflow:hidden; border-radius:16px; padding:20px 18px; margin-bottom:14px;
        background:linear-gradient(135deg, rgba(212,175,55,.14), rgba(139,92,246,.10) 45%, rgba(34,211,238,.10));
        border:1px solid var(--line-bright); }
      .hero::before { content:''; position:absolute; top:-40px; right:-40px; width:140px; height:140px;
        border-radius:50%; background:radial-gradient(circle, rgba(212,175,55,.25), transparent 70%); }
      .hero .hk { font-size:9.5px; letter-spacing:3px; text-transform:uppercase; color:var(--cyan); font-weight:800; margin-bottom:6px; }
      .hero .ht { font-size:21px; font-weight:800; letter-spacing:.5px; line-height:1.15; }
      .hero .ht em { font-style:normal; background:linear-gradient(120deg, var(--gold), var(--purple)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
      .hero .hs { font-size:12px; color:var(--muted); margin-top:6px; }
    </style>

  <body>
    <div class="wrap">
      <header>
        <button id="navToggle" aria-label="Open menu">☰</button>
        <div class="logo"><div class="mark">◈</div><h1>GOD SPEED</h1></div>
        <span class="badge" id="liveBadge">…</span>
      </header>
      <div id="app"><div class="loading">Loading…</div></div>
    </div>
    <div id="navBackdrop"></div>
    <nav id="sideNav">
      <div class="nav-brand">
        <div class="mark" style="width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#182a22,#0f1a16);border:1.5px solid var(--gold);color:var(--gold);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center">◈</div>
        <h2>GOD SPEED</h2>
      </div>
      <div class="navsec">⚡ Command</div>
      <div class="nav-item active" data-tab="overview"><span class="nic">🏠</span>Overview</div>

      <div class="nav-item" data-tab="osint"><span class="nic">🔎</span>OSINT</div>
      <div class="nav-item" data-tab="ingest"><span class="nic">📥</span>Ingest</div>
      <div class="navsec">🛠️ Engineering</div>
      <div class="nav-item" data-tab="pipelines"><span class="nic">🔗</span>Pipelines</div>
      <div class="nav-item" data-tab="agents"><span class="nic">🤖</span>Agents</div>
      <div class="nav-item" data-tab="logs"><span class="nic">📜</span>Logs</div>

      <div class="nav-item" data-tab="models"><span class="nic">🧠</span>Models</div>
      <div class="nav-item" data-tab="relay"><span class="nic">🤖</span>Relay</div>
      <div class="nav-item" data-tab="system"><span class="nic">🖥️</span>System</div>
      <div class="nav-item" data-tab="review"><span class="nic">✅</span>Review</div>
      <div class="nav-item" data-tab="settings"><span class="nic">⚙️</span>Settings</div>
      <div class="nav-item" data-tab="northlet" onclick="openNorthlet()"><span class="nic">🏛️</span>NorthLet ↗</div>
      <div class="nav-live"><span class="dot" style="background:var(--brand-bright)"></span><span id="navLiveText">live</span></div>
    </nav>
