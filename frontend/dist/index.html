<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Godspeed · Control</title>
    <style>
      :root {
        --bg: #0a0e0a; --bg2: #0d1110; --card: #0f1411; --card2: #1b241e;
        --text: #e4edf7; --muted: #7a867d; --brand: #27bd89;
        --brand-bright: #39e6a6; --brand-dim: #0b6a40; --teal: #4fd6c8;
        --amber: #ffc24b; --red: #ff5c6a; --border: #1c241e;
      }
      * { margin:0; padding:0; box-sizing:border-box; }
      body { font-family:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif;
        background:linear-gradient(180deg,var(--bg) 0%,#060a08 100%); color:var(--text); min-height:100vh; padding:16px; }
      .wrap { max-width:520px; margin:0 auto; }
      header { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
      header .logo { display:flex; align-items:center; gap:10px; }
      header .logo .mark { width:34px; height:34px; border-radius:9px;
        background:linear-gradient(135deg,var(--brand),var(--teal));
        display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; }
      header h1 { font-size:20px; font-weight:700; letter-spacing:.3px; }
      header .badge { font-size:11px; color:var(--brand-bright); background:rgba(39,189,137,0.12);
        padding:4px 10px; border-radius:20px; border:1px solid rgba(39,189,137,0.35); font-weight:600; }
      .tabbar { display:flex; gap:6px; margin-bottom:14px; }
      .tab { flex:1; padding:9px; background:var(--card); color:var(--muted);
        border:1px solid var(--border); border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; text-align:center; }
      .tab.active { background:var(--card2); color:var(--brand-bright); border-color:var(--brand-dim); }
      .grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:14px; }
      .tile { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; text-align:center; }
      .tile .label { font-size:11px; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.5px; }
      .tile .value { font-size:18px; font-weight:700; }
      .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
      .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; }
      .card h3 { font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin-bottom:10px; }
      .card .row { display:flex; justify-content:space-between; margin-bottom:8px; font-size:13px; }
      .card .row .muted { color:var(--muted); }
      .bar { height:8px; background:var(--bg2); border-radius:6px; overflow:hidden; }
      .bar-fill { height:100%; border-radius:6px; background:linear-gradient(90deg,var(--brand),var(--teal)); }
      .bar-fill.amber { background:linear-gradient(90deg,var(--amber),#ffd77a); }
      .svc { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:4px 16px; }
      .svc-item { display:flex; justify-content:space-between; align-items:center;
        padding:11px 0; border-bottom:1px solid var(--border); font-size:13px; }
      .svc-item:last-child { border-bottom:none; }
      .svc-item .name { color:var(--muted); font-family:monospace; font-size:12px; }
      .svc-item .state { font-size:12px; font-weight:600; }
      .models { display:grid; grid-template-columns:1fr 1fr; gap:8px; max-height:180px; overflow-y:auto; }
      .model-chip { background:var(--card2); border:1px solid var(--border); border-radius:10px;
        padding:8px 10px; font-size:12px; font-family:monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      footer { text-align:center; color:var(--muted); font-size:11px; margin-top:16px; letter-spacing:.3px; }
      .btn { width:100%; padding:14px; margin-top:14px;
        background:linear-gradient(90deg,var(--brand),var(--teal)); color:#04150e;
        border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; }
      .btn:active { transform:scale(.98); }
      .loading { text-align:center; color:var(--muted); padding:40px 0; }
    </style>
    <script type="module" crossorigin src="./assets/index-C8A-HyMP.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D1fJFTh1.css">
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="logo"><div class="mark">⚡</div><h1>Godspeed Control</h1></div>
        <span class="badge" id="liveBadge">…</span>
      </header>
      <div class="tabbar">
        <div class="tab active" data-tab="overview">Overview</div>
        <div class="tab" data-tab="models">Models</div>
        <div class="tab" data-tab="relay">Relay</div>
        <div class="tab" data-tab="system">System</div>
        <div class="tab" data-tab="logs">Logs</div>
      </div>
      <div id="app"><div class="loading">Loading…</div></div>
    </div>
  </body>
</html>
